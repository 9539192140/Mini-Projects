{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Work Tracker - Bootstrap</title>
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Animate.css for animations -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    .container {
      background-color: rgba(255, 255, 255, 0.95);
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      padding: 2rem;
      margin-top: 3rem;
      margin-bottom: 3rem;
      animation: fadeIn 0.5s ease-in-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .task-item {
      transition: all 0.3s ease;
      border-left: 4px solid #667eea;
    }
    
    .task-item:hover {
      transform: translateX(5px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }
    
    .completed {
      text-decoration: line-through;
      opacity: 0.7;
      border-left-color: #28a745;
    }
    
    .btn-add {
      background: linear-gradient(to right, #667eea, #764ba2);
      border: none;
      transition: all 0.3s;
    }
    
    .btn-add:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }
    
    .empty-state {
      padding: 2rem;
      background-color: rgba(255, 255, 255, 0.7);
      border-radius: 10px;
      text-align: center;
    }
    
    .empty-state i {
      font-size: 3rem;
      color: #764ba2;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <div class="container py-5 animate__animated animate__fadeIn" style="max-width: 600px;">
    <h1 class="text-center mb-4 text-primary fw-bold">
      <i class="fas fa-tasks me-2"></i> Work Tracker
    </h1>

    <form method="POST" autocomplete="off" class="mb-4 animate__animated animate__fadeInUp">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-12">
          <div class="input-group">
            <span class="input-group-text bg-primary text-white">
              <i class="fas fa-tasks"></i>
            </span>
            <input type="text" name="task" class="form-control" value="{{data.task}}" placeholder="Enter your task" required />
          </div>
        </div>
        <div class="col-12">
          <div class="input-group">
            <span class="input-group-text bg-secondary text-white">
              <i class="fas fa-align-left"></i>
            </span>
            <input type="text" name="description" class="form-control" value="{{data.description}}" placeholder="Add a description (optional)" />
          </div>
        </div>
        <div class="col-12">
          <button class="btn btn-primary w-100 btn-add" type="submit">
            <i class="fas fa-save me-2"></i>Update Task
          </button>
        </div>
      </div>
    </form>

  </div>

  <!-- Bootstrap JS Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Font Awesome JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <script>
    // Initialize tooltips
    const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
    const tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
      return new bootstrap.Tooltip(tooltipTriggerEl)
    })
    
    // Add checkbox functionality
    document.querySelectorAll('.task-checkbox').forEach(checkbox => {
      checkbox.addEventListener('change', function() {
        const taskItem = this.closest('.task-item')
        if (this.checked) {
          taskItem.classList.add('completed')
          // In a real app, you'd send an AJAX request to mark as complete
        } else {
          taskItem.classList.remove('completed')
        }
      })
    })
  </script>
</body>
</html>
