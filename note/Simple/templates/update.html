<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Note - NoteTaker Pro</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --primary-light: #e0e4fc;
            --accent: #4cc9f0;
            --text: #2b2d42;
            --text-light: #8d99ae;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --warning: #f8961e;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 2rem 0;
            background-image: url('https://images.unsplash.com/photo-1518655048521-f130df041f66?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }

        .container {
            max-width: 600px;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--primary);
            text-align: center;
            margin-bottom: 1rem;
        }

        .logo i {
            color: var(--accent);
        }

        /* Note Form */
        .note-form {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .note-form:hover {
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .form-title {
            color: var(--primary);
            text-align: center;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            margin-bottom: 1rem;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.25rem rgba(67, 97, 238, 0.25);
        }

        .btn-update {
            background-color: var(--warning);
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 500;
            width: 100%;
            color: white;
            transition: all 0.3s ease;
        }

        .btn-update:hover {
            background-color: #e07d0e;
            transform: translateY(-2px);
        }

        .back-link {
            display: block;
            text-align: center;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            padding: 10px;
            border-radius: 8px;
        }

        .back-link:hover {
            text-decoration: none;
            background-color: var(--primary-light);
            color: var(--primary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo {
                font-size: 2rem;
            }
            
            .note-form {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container animate__animated animate__fadeIn">
        <div class="logo">
            <i class="fas fa-book-open me-2"></i>
            <span>NoteTaker Pro</span>
        </div>

        <div class="note-form">
            <h2 class="form-title">Update Note</h2>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="head" class="form-label">Title</label>
                    <input type="text" class="form-control" id="head" name="head" value="{{data.head}}" placeholder="Enter heading" required>
                </div>
                <div class="mb-3">
                    <label for="note" class="form-label">Note Content</label>
                    <textarea class="form-control" id="note" name="note" rows="5" placeholder="Enter your note content" required>{{data.note}}</textarea>
                </div>
                <button type="submit" class="btn btn-update">
                    <i class="fas fa-save me-2"></i> Update Note
                </button>
            </form>
            <a href="{% url 'home' %}" class="back-link mt-3">
                <i class="fas fa-arrow-left me-2"></i> Back to Home
            </a>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
